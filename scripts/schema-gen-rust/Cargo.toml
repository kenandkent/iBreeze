[package]
name = "schema-gen-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
walkdir = "2"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
heck = "0.5"
quote = "1.0"
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
prettyplease = "0.2"

[profile.release]
lto = true
opt-level = 3