name: Admin Web Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        working-directory: apps/admin-web
      - name: Lint
        run: npm run lint
        working-directory: apps/admin-web
      - name: Type check
        run: npm run typecheck
        working-directory: apps/admin-web
      - name: Test
        run: npm run test
        working-directory: apps/admin-web
