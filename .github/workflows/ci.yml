name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        scope: [contracts, desktop, sidecar, backend, e2e, security, drift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install system dependencies
        if: matrix.scope == 'desktop'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Install Rust
        # Contracts/desktop/drift need cargo: contracts/drift for schema-gen-rust
        # (called by check-contract-drift.sh), desktop for the main Rust crate.
        if: matrix.scope == 'contracts' || matrix.scope == 'desktop' || matrix.scope == 'drift'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-nextest
        if: matrix.scope == 'desktop'
        run: cargo install cargo-nextest --locked
      - name: Install cargo-llvm-cov
        if: matrix.scope == 'desktop'
        run: cargo install cargo-llvm-cov --locked
      - name: Verify
        run: bash scripts/verify-all.sh --scope ${{ matrix.scope }}
