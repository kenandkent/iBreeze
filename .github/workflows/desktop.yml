name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm --prefix apps/desktop ci
      - name: Lint
        run: npm --prefix apps/desktop run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm --prefix apps/desktop ci
      - name: Typecheck
        run: npm --prefix apps/desktop run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm --prefix apps/desktop ci
      - name: Test with coverage
        run: npm --prefix apps/desktop run test:coverage
