name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit packages/contracts
        run: npm --prefix packages/contracts audit --audit-level=high
      - name: Audit apps/desktop
        run: npm --prefix apps/desktop audit --audit-level=high
      - name: Audit apps/admin-web
        run: npm --prefix apps/admin-web audit --audit-level=high

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
