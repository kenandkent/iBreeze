name: Sidecar Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: sidecar
      - name: Lint
        run: uv run ruff check ibreeze/
        working-directory: sidecar
      - name: Type check
        run: uv run mypy ibreeze/
        working-directory: sidecar
      - name: Test with coverage
        run: uv run pytest --cov=ibreeze --cov-branch --cov-fail-under=77
        working-directory: sidecar
