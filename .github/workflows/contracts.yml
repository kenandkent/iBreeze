name: Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm --prefix packages/contracts ci
      - name: Lint
        run: npm --prefix packages/contracts run lint
      - name: Check generated schemas
        run: npm --prefix packages/contracts run check-generated
      - name: Check contract drift
        run: bash scripts/check-contract-drift.sh
