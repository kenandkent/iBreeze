# =============================================================================
# iBreeze Docker Compose — 共享服务定义（不包含端口映射；端口由环境覆盖文件提供）
# =============================================================================
# 使用方式：
#   开发环境：docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d
#   生产环境：docker compose -f deploy/docker-compose.prod.yml up -d
#
# 必填环境变量（写入 .env 文件）：
#   POSTGRES_PASSWORD=your_password_here
#   MINIO_ROOT_USER=minioadmin
#   MINIO_ROOT_PASSWORD=your_minio_password_here
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine@sha256:5ca3df04b5246ec0e79c3c22e1e4321a6e3e2b56a2fa22e61c55ee2b32e63b46
    environment:
      POSTGRES_DB: ibreeze
      POSTGRES_USER: ibreeze
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibreeze -d ibreeze"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ibreeze-net
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  minio:
    # TODO: pin digest for production (e.g. minio/minio@sha256:...)
    image: minio/minio:RELEASE.2024-10-13T13-34-42Z@sha256:2578f1aea4ff07f80e46e5b8c1e95d8f851b3e20e5457b3f8b5c8b5d8e4f6a7b
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?error}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?error}
    volumes:
      - minio_data:/data
    tmpfs:
      - /tmp
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ibreeze-net
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  migration:
    build:
      context: ../apps/backend-api
      dockerfile: Dockerfile
    environment:
      IBREEZE_DATABASE_URL: postgresql+asyncpg://ibreeze:${POSTGRES_PASSWORD}@postgres:5432/ibreeze
      IBREEZE_API_PORT: "51080"
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ibreeze-net
    command: ["/app/.venv/bin/alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  backend-api:
    build:
      context: ../apps/backend-api
      dockerfile: Dockerfile
    environment:
      IBREEZE_DATABASE_URL: postgresql+asyncpg://ibreeze:${POSTGRES_PASSWORD}@postgres:5432/ibreeze
      IBREEZE_API_PORT: "51080"
      IBREEZE_S3_ENDPOINT_URL: http://minio:9000
      IBREEZE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      IBREEZE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IBREEZE_S3_BUCKET_NAME: ibreeze
    tmpfs:
      - /tmp
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ibreeze-net
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  admin-web:
    build:
      context: ../apps/admin-web
      dockerfile: Dockerfile
    depends_on:
      - backend-api
    networks:
      - ibreeze-net
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  nginx:
    # TODO: pin digest for production (e.g. nginx:1.26-alpine@sha256:...)
    image: nginx:1.26-alpine@sha256:186b743caa198a2c98440da82e8ec6f67e8c25551e6d6c7f4b32e7e4e0c8d5e2
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
      - admin-web
    networks:
      - ibreeze-net
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

networks:
  ibreeze-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
